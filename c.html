<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="robots" content="noindex, nofollow">
  <title>EBSU Student ID Card Verification</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --brand: #0284c7;
      --green-bg: #ecfdf5;
      --green-border: #10b981;
      --green-text: #065f46;
      --red-bg: #fef2f2;
      --red-border: #ef4444;
      --red-text: #991b1b;
      --amber-bg: #fffbeb;
      --amber-border: #f59e0b;
      --amber-text: #92400e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --card-bg: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --brand: #38bdf8;
        --green-bg: #064e3b;
        --green-border: #059669;
        --green-text: #a7f3d0;
        --red-bg: #450a0a;
        --red-border: #dc2626;
        --red-text: #fecaca;
        --amber-bg: #451a03;
        --amber-border: #d97706;
        --amber-text: #fde68a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      line-height: 1.5;
    }
    .verify-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    .card-header {
      padding: 20px 24px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(2, 132, 199, 0.04) 0%, transparent 100%);
    }
    .inst-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--brand);
      text-transform: uppercase;
    }
    .inst-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .card-body {
      padding: 24px;
    }
    .status-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid;
      margin-bottom: 20px;
    }
    .status-banner.valid {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-text);
    }
    .status-banner.invalid, .status-banner.revoked, .status-banner.tampered, .status-banner.suspended {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
    }
    .status-banner.expired, .status-banner.provisional, .status-banner.unpaid {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber-text);
    }
    .status-icon {
      font-size: 24px;
      line-height: 1;
      flex-shrink: 0;
    }
    .status-text-wrap {
      display: flex;
      flex-direction: column;
    }
    .status-heading {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .status-detail {
      font-size: 11px;
      opacity: 0.9;
      margin-top: 1px;
    }
    .student-profile {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }
    .photo-frame {
      width: 90px;
      height: 114px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: #e2e8f0;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-placeholder {
      font-size: 38px;
      color: var(--muted);
    }
    .profile-info {
      flex: 1;
      min-width: 0;
    }
    .student-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
    }
    .student-matric {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: var(--brand);
      font-weight: 700;
      margin-top: 4px;
    }
    .details-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    .details-table tr {
      border-bottom: 1px solid var(--border);
    }
    .details-table tr:last-child {
      border-bottom: none;
    }
    .details-table td {
      padding: 10px 0;
      font-size: 13px;
    }
    .details-table td.lbl {
      color: var(--muted);
      width: 38%;
      font-weight: 500;
    }
    .details-table td.val {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }
    .footer-note {
      padding: 14px 24px;
      background: rgba(0, 0, 0, 0.02);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 30px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <main class="verify-card" id="verify-card-container">
    <header class="card-header">
      <div class="inst-title">Ebonyi State University</div>
      <div class="inst-sub">Official Digital ID Verification Portal</div>
    </header>

    <div class="card-body" id="card-body">
      <div class="spinner" id="loading-spinner"></div>
      <p style="text-align: center; font-size: 13px; color: var(--muted);" id="loading-text">
        Verifying digital card credentials…
      </p>
    </div>

    <footer class="footer-note" id="card-footer" style="display: none;">
      <span id="scan-timestamp">Checked: —</span>
      <span>Ebonyi State University · All Rights Reserved</span>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="qr.js"></script>
  <script src="js/cardTemplate.js"></script>
  <script src="canvas.js"></script>
  <script>
    (function () {
      'use strict';

      const bodyEl = document.getElementById('card-body');
      const footerEl = document.getElementById('card-footer');
      const timeEl = document.getElementById('scan-timestamp');

      function b64UrlToUuid(b64url) {
        try {
          if (!b64url) return null;
          if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(b64url)) {
            return b64url.toLowerCase();
          }
          let base64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
          while (base64.length % 4) base64 += '=';
          const binary = atob(base64);
          if (binary.length !== 16) return null;
          let hex = '';
          for (let i = 0; i < 16; i++) {
            hex += binary.charCodeAt(i).toString(16).padStart(2, '0');
          }
          return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20, 32)}`.toLowerCase();
        } catch (e) {
          return null;
        }
      }

      function escapeHtml(str) {
        if (!str) return '';
        const d = document.createElement('div');
        d.textContent = String(str);
        return d.innerHTML;
      }

      function renderStatusBanner(status, customDetail) {
        const s = (status || 'invalid').toLowerCase();
        let icon = '✕';
        let cls = 'invalid';
        let heading = 'INVALID CARD';
        let detail = customDetail || 'This link does not represent a valid university card.';

        if (s === 'valid') {
          icon = '✓';
          cls = 'valid';
          heading = 'OFFICIAL ID CARD VERIFIED';
          detail = customDetail || 'Student is currently active and authenticated by university registry.';
        } else if (s === 'revoked') {
          icon = '⛔';
          cls = 'revoked';
          heading = 'CARD REVOKED';
          detail = customDetail || 'This student ID card has been revoked and is no longer valid.';
        } else if (s === 'suspended') {
          icon = '⏸';
          cls = 'suspended';
          heading = 'STUDENT SUSPENDED';
          detail = customDetail || 'Access has been suspended by University Administration.';
        } else if (s === 'expired') {
          icon = '⌛';
          cls = 'expired';
          heading = 'CARD EXPIRED';
          detail = customDetail || 'The validity period for this ID card has expired.';
        } else if (s === 'pass_expired') {
          icon = '🔄';
          cls = 'expired';
          heading = '60-SECOND PASS EXPIRED';
          detail = customDetail || 'Digital live pass has expired. Student must refresh their screen.';
        } else if (s === 'unpaid') {
          icon = '⚠️';
          cls = 'unpaid';
          heading = 'ID FEE UNPAID';
          detail = customDetail || 'Student ID card fee is pending confirmation.';
        } else if (s === 'not_found') {
          icon = '✕';
          cls = 'invalid';
          heading = 'CARD NOT FOUND';
          detail = 'No matching student record exists in the identity database.';
        } else if (s === 'tampered') {
          icon = '🚨';
          cls = 'tampered';
          heading = 'CRYPTOGRAPHIC SIGNATURE INVALID';
          detail = 'Card signature does not match canonical registry data.';
        }

        return `
          <div class="status-banner ${cls}">
            <div class="status-icon">${icon}</div>
            <div class="status-text-wrap">
              <div class="status-heading">${escapeHtml(heading)}</div>
              <div class="status-detail">${escapeHtml(detail)}</div>
            </div>
          </div>
        `;
      }

      function renderStudentCard(status, student, checkedAt, customDetail) {
        timeEl.textContent = 'Verified: ' + new Date(checkedAt || Date.now()).toLocaleString();
        footerEl.style.display = 'flex';

        if (!student || status === 'not_found' || status === 'tampered' || status === 'invalid') {
          bodyEl.innerHTML = renderStatusBanner(status, customDetail);
          return;
        }

        const photoHtml = student.photo_url || student.photo
          ? `<img src="${escapeHtml(student.photo_url || student.photo)}" alt="Student Passport" />`
          : `<div class="photo-placeholder">👤</div>`;

        bodyEl.innerHTML = `
          ${renderStatusBanner(status, customDetail)}

          <div class="student-profile">
            <div class="photo-frame">${photoHtml}</div>
            <div class="profile-info">
              <div class="student-name">${escapeHtml(student.name || 'STUDENT NAME')}</div>
              <div class="student-matric">${escapeHtml(student.matric || '—')}</div>
            </div>
          </div>

          <table class="details-table">
            <tbody>
              <tr>
                <td class="lbl">Faculty</td>
                <td class="val">${escapeHtml(student.faculty || '—')}</td>
              </tr>
              <tr>
                <td class="lbl">Department</td>
                <td class="val">${escapeHtml(student.dept || student.department || '—')}</td>
              </tr>
              <tr>
                <td class="lbl">Academic Level</td>
                <td class="val">${escapeHtml(student.level || '—')}</td>
              </tr>
              <tr>
                <td class="lbl">Valid Expiry</td>
                <td class="val">${escapeHtml(student.expiry ? String(student.expiry) : '—')}</td>
              </tr>
            </tbody>
          </table>
          ${(status === 'valid' || status === 'expired') && student ? `
            <div style="margin-top: 20px; text-align: center;">
              <button type="button" id="btn-download-c-png" style="background: linear-gradient(135deg, #059669, #10b981); color: #ffffff; border: none; padding: 11px 22px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(16,185,129,0.3); transition: transform 0.15s ease;">
                📥 Download Verified ID Card (PNG)
              </button>
            </div>
          ` : ''}
        `;

        if ((status === 'valid' || status === 'expired') && student) {
          setTimeout(() => {
            const dlBtn = document.getElementById('btn-download-c-png');
            if (dlBtn) {
              dlBtn.onclick = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 1011;
                canvas.height = 638;
                const tpl = (typeof CardTemplate !== 'undefined' && CardTemplate.get) ? CardTemplate.get() : null;
                const payload = {
                  ...student,
                  name: student.name || 'STUDENT',
                  matric: student.matric || student.regNo || 'STUDENT',
                  photo_url: student.photo_url || student.photo || 'images/demo_user_photo.jpg',
                  sig_url: student.signature_url || student.sig_url || 'images/demo_user_sig.png',
                  card_signature: student.card_signature || 'ED25519_DEMO_SIGNATURE',
                };
                const matricClean = String(payload.matric).replace(/\//g, '-');
                let downloaded = false;
                const triggerDl = () => {
                  if (downloaded) return;
                  downloaded = true;
                  const a = document.createElement('a');
                  a.href = canvas.toDataURL('image/png');
                  a.download = `EBSU-ID-${matricClean}-VERIFIED.png`;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                };
                if (typeof drawCard === 'function') {
                  drawCard(canvas, tpl, payload, 1.0, triggerDl);
                  setTimeout(triggerDl, 250);
                }
              };
            }
          }, 50);
        }
      }

      async function verify() {
        const path = window.location.pathname;
        const hash = window.location.hash;
        const search = window.location.search;

        let cardId = null;
        let sig = null;
        let token = null;

        // Route: /c/<card_id_b64url>.<sig> OR query ?c=...
        const cMatch = path.match(/\/c\/([^./]+)\.([^./]+)/) || search.match(/[?&]c=([^.&]+)\.([^.&]+)/);
        // Route: /p/<token> OR query ?p=...
        const pMatch = path.match(/\/p\/([^/]+)/) || search.match(/[?&]p=([^&]+)/);

        if (cMatch) {
          const rawId = cMatch[1];
          sig = cMatch[2];
          cardId = b64UrlToUuid(rawId) || rawId;
        } else if (pMatch) {
          token = decodeURIComponent(pMatch[1]);
        }

        if (!cardId && !token) {
          renderStudentCard('invalid', null, new Date(), 'The link provided is incomplete or malformed.');
          return;
        }

        const verifyUrl = (typeof EBSU_CONFIG !== 'undefined' && EBSU_CONFIG.VERIFY_CARD_URL)
          ? EBSU_CONFIG.VERIFY_CARD_URL
          : 'https://qsrfvfdojtmsinewxetz.supabase.co/functions/v1/verify-card';

        try {
          const headers = { 'Content-Type': 'application/json' };
          if (typeof EBSU_CONFIG !== 'undefined' && EBSU_CONFIG.SUPABASE_ANON_KEY) {
            headers['apikey'] = EBSU_CONFIG.SUPABASE_ANON_KEY;
          }

          const payload = token
            ? { token, location: 'Public Web Scanner (c.html)' }
            : { card_id: cardId, signature: sig, location: 'Public Web Scanner (c.html)' };

          const res = await fetch(verifyUrl, {
            method: 'POST',
            headers,
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            const data = await res.json();
            renderStudentCard(data.status, data.student, data.checked_at, data.reason);
            return;
          }

          // If offline or remote call returned non-200, check local registry fallback for dev/demo
          fallbackLocalVerify(cardId, sig, token);

        } catch (fetchErr) {
          fallbackLocalVerify(cardId, sig, token);
        }
      }

      function fallbackLocalVerify(cardId, sig, token) {
        try {
          const localList = JSON.parse(localStorage.getItem('ebsu_local_students') || '[]');
          const cleanId = (cardId || '').toLowerCase();
          const match = localList.find(s => 
            (s.id && s.id.toLowerCase() === cleanId) || 
            (s.matric && s.matric.toLowerCase() === cleanId) ||
            (s.school_reg_no && s.school_reg_no.toLowerCase() === cleanId)
          );

          if (match) {
            renderStudentCard('valid', {
              name: match.name,
              matric: match.matric,
              faculty: match.faculty,
              dept: match.dept,
              level: match.level,
              expiry: match.expiry,
              photo_url: match.photo_url || match.photo
            }, new Date().toISOString(), 'Verified via localized identity cache.');
            return;
          }
        } catch (_) {}

        renderStudentCard('invalid', null, new Date().toISOString(), 'Unable to contact verification server or verify signature.');
      }

      window.addEventListener('DOMContentLoaded', verify);
    })();
  </script>
</body>
</html>
