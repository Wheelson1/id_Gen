<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="robots" content="noindex, nofollow">
  <title>EBSU Student ID Card Verification</title>
  <style>
    @font-face { font-family: 'Besley'; font-weight: 600; font-display: swap; src: url('/fonts/besley-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Source Sans 3'; font-weight: 400; font-display: swap; src: url('/fonts/source-sans-3-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Source Sans 3'; font-weight: 600; font-display: swap; src: url('/fonts/source-sans-3-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Source Sans 3'; font-weight: 700; font-display: swap; src: url('/fonts/source-sans-3-latin-700-normal.woff2') format('woff2'); }
    /* Forest-green palette, same as the rest of the site (css/theme.css).
       This page stands alone because it is opened from printed QR codes. */
    :root {
      --bg: #DAF1DE;
      --card-bg: #EEF8F0;
      --border: #B4D4BE;
      --text: #051F20;
      --muted: #235347;
      --brand: #163832;
      --band: #0B2B26;
      --band-ink: #DAF1DE;
      --band-ink-2: #8EB69B;
      --green-bg: #C6E4CE;
      --green-border: #1D6B44;
      --green-text: #0B3A26;
      --red-bg: #FBE9E7;
      --red-border: #A8261C;
      --red-text: #7F1D16;
      --amber-bg: #FBF1D9;
      --amber-border: #7A5200;
      --amber-text: #5C3D00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #051F20;
        --card-bg: #0B2B26;
        --border: #235347;
        --text: #DAF1DE;
        --muted: #8EB69B;
        --brand: #B9DEC3;
        --band: #031617;
        --green-bg: #163832;
        --green-border: #6CCB95;
        --green-text: #DAF1DE;
        --red-bg: #3A1B18;
        --red-border: #F08A82;
        --red-text: #FBD3CF;
        --amber-bg: #33270F;
        --amber-border: #E0A458;
        --amber-text: #F6DDB6;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      line-height: 1.5;
    }
    .verify-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 1px rgba(5, 31, 32, .10), 0 18px 40px -18px rgba(5, 31, 32, .45);
    }
    .card-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--band);
      color: var(--band-ink);
    }
    .inst-title {
      font-family: 'Besley', Georgia, serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--band-ink);
    }
    .inst-sub {
      font-size: 13px;
      color: var(--band-ink-2);
      margin-top: 1px;
    }
    .card-body {
      padding: 24px;
    }
    .status-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 4px;
      border: 1.5px solid;
      margin-bottom: 20px;
    }
    .status-banner.valid {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-text);
    }
    .status-banner.invalid, .status-banner.revoked, .status-banner.tampered, .status-banner.suspended, .status-banner.lost_card {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
    }
    .status-banner.expired, .status-banner.provisional, .status-banner.unpaid, .status-banner.offline {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber-text);
    }
    .status-icon {
      font-size: 24px;
      line-height: 1;
      flex-shrink: 0;
    }
    .status-text-wrap {
      display: flex;
      flex-direction: column;
    }
    .status-heading {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .status-detail {
      font-size: 11px;
      opacity: 0.9;
      margin-top: 1px;
    }
    .student-profile {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }
    .photo-frame {
      width: 90px;
      height: 114px;
      border-radius: 4px;
      border: 2px solid var(--border);
      background: var(--border);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-placeholder {
      font-size: 38px;
      color: var(--muted);
    }
    .profile-info {
      flex: 1;
      min-width: 0;
    }
    .student-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
    }
    .student-matric {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: var(--brand);
      font-weight: 700;
      margin-top: 4px;
    }
    .details-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    .details-table tr {
      border-bottom: 1px solid var(--border);
    }
    .details-table tr:last-child {
      border-bottom: none;
    }
    .details-table td {
      padding: 10px 0;
      font-size: 13px;
    }
    .details-table td.lbl {
      color: var(--muted);
      width: 38%;
      font-weight: 500;
    }
    .details-table td.val {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }
    .footer-note {
      padding: 14px 24px;
      background: rgba(0, 0, 0, 0.02);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 30px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <main class="verify-card" id="verify-card-container">
    <header class="card-header">
      <img src="/crest_large.png.jpeg" alt="" width="40" height="40" style="width:40px;height:40px;object-fit:contain;background:#fff;border-radius:3px;padding:1px;flex-shrink:0;" onerror="this.remove()">
      <div>
        <div class="inst-title">Ebonyi State University</div>
        <div class="inst-sub">Student ID card check</div>
      </div>
    </header>

    <div class="card-body" id="card-body">
      <div class="spinner" id="loading-spinner"></div>
      <p style="text-align: center; font-size: 13px; color: var(--muted);" id="loading-text">
        Verifying digital card credentials…
      </p>
    </div>

    <footer class="footer-note" id="card-footer" style="display: none;">
      <span id="scan-timestamp">Checked: —</span>
      <span>Ebonyi State University · All Rights Reserved</span>
    </footer>
  </main>

  <script src="config.js"></script>
  <script>
    (function () {
      'use strict';

      const bodyEl = document.getElementById('card-body');
      const footerEl = document.getElementById('card-footer');
      const timeEl = document.getElementById('scan-timestamp');

      function b64UrlToUuid(b64url) {
        try {
          if (!b64url) return null;
          if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(b64url)) {
            return b64url.toLowerCase();
          }
          let base64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
          while (base64.length % 4) base64 += '=';
          const binary = atob(base64);
          if (binary.length !== 16) return null;
          let hex = '';
          for (let i = 0; i < 16; i++) {
            hex += binary.charCodeAt(i).toString(16).padStart(2, '0');
          }
          return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20, 32)}`.toLowerCase();
        } catch (e) {
          return null;
        }
      }

      function escapeHtml(str) {
        if (!str) return '';
        const d = document.createElement('div');
        d.textContent = String(str);
        return d.innerHTML;
      }

      function renderStatusBanner(status, customDetail) {
        const s = (status || 'invalid').toLowerCase();
        let icon = '✕';
        let cls = 'invalid';
        let heading = 'INVALID CARD';
        let detail = customDetail || 'This link does not represent a valid university card.';

        if (s === 'valid') {
          icon = '✓';
          cls = 'valid';
          heading = 'OFFICIAL ID CARD VERIFIED';
          detail = customDetail || 'Student is currently active and authenticated by university registry.';
        } else if (s === 'revoked') {
          icon = '⛔';
          cls = 'revoked';
          heading = 'CARD REVOKED';
          detail = customDetail || 'This student ID card has been revoked and is no longer valid.';
        } else if (s === 'lost_card') {
          icon = '✕';
          cls = 'lost_card';
          heading = 'REPORTED LOST OR STOLEN';
          detail = customDetail || 'This card was reported lost or stolen and has been deactivated.';
        } else if (s === 'suspended') {
          icon = '⏸';
          cls = 'suspended';
          heading = 'STUDENT SUSPENDED';
          detail = customDetail || 'Access has been suspended by University Administration.';
        } else if (s === 'expired') {
          icon = '⌛';
          cls = 'expired';
          heading = 'CARD EXPIRED';
          detail = customDetail || 'The validity period for this ID card has expired.';
        } else if (s === 'pass_expired') {
          icon = '🔄';
          cls = 'expired';
          heading = '60-SECOND PASS EXPIRED';
          detail = customDetail || 'Digital live pass has expired. Student must refresh their screen.';
        } else if (s === 'unpaid') {
          icon = '⚠️';
          cls = 'unpaid';
          heading = 'ID FEE UNPAID';
          detail = customDetail || 'Student ID card fee is pending confirmation.';
        } else if (s === 'not_found') {
          icon = '✕';
          cls = 'invalid';
          heading = 'CARD NOT FOUND';
          detail = 'No matching student record exists in the identity database.';
        } else if (s === 'tampered') {
          icon = '🚨';
          cls = 'tampered';
          heading = 'CRYPTOGRAPHIC SIGNATURE INVALID';
          detail = 'Card signature does not match canonical registry data.';
        } else if (s === 'offline') {
          icon = '⚠️';
          cls = 'offline';
          heading = 'Cannot reach server — Verification service offline';
          detail = customDetail || 'Network connection unavailable. No verification verdict can be issued offline.';
        }

        return `
          <div class="status-banner ${cls}">
            <div class="status-icon">${icon}</div>
            <div class="status-text-wrap">
              <div class="status-heading">${escapeHtml(heading)}</div>
              <div class="status-detail">${escapeHtml(detail)}</div>
            </div>
          </div>
        `;
      }

      // Public response strictly renders ONLY: name, photo_url, faculty, dept, level, matric, expiry, status
      function renderStudentCard(status, student, checkedAt, customDetail) {
        timeEl.textContent = 'Checked: ' + new Date(checkedAt || Date.now()).toLocaleString();
        footerEl.style.display = 'flex';

        if (!student || ['not_found', 'tampered', 'invalid', 'offline'].includes(status)) {
          bodyEl.innerHTML = renderStatusBanner(status, customDetail);
          return;
        }

        const photoHtml = student.photo_url
          ? `<img src="${escapeHtml(student.photo_url)}" alt="Student Passport" />`
          : `<div class="photo-placeholder">👤</div>`;

        bodyEl.innerHTML = `
          ${renderStatusBanner(status, customDetail)}

          <div class="student-profile">
            <div class="photo-frame">${photoHtml}</div>
            <div class="profile-info">
              <div class="student-name">${escapeHtml(student.name || '—')}</div>
              <div class="student-matric">${escapeHtml(student.matric || '—')}</div>
            </div>
          </div>

          <table class="details-table">
            <tbody>
              <tr>
                <td class="lbl">Faculty</td>
                <td class="val">${escapeHtml(student.faculty || 'N/A')}</td>
              </tr>
              <tr>
                <td class="lbl">Department</td>
                <td class="val">${escapeHtml(student.dept || 'N/A')}</td>
              </tr>
              <tr>
                <td class="lbl">Academic Level</td>
                <td class="val">${escapeHtml(student.level || 'N/A')}</td>
              </tr>
              <tr>
                <td class="lbl">Valid Expiry</td>
                <td class="val">${escapeHtml(student.expiry ? String(student.expiry) : 'N/A')}</td>
              </tr>
              <tr>
                <td class="lbl">Card Status</td>
                <td class="val">${escapeHtml((student.status || status || '').toUpperCase())}</td>
              </tr>
            </tbody>
          </table>
        `;
      }

      async function verify() {
        const path = window.location.pathname;
        const search = window.location.search;

        let cardId = null;
        let sig = null;
        let token = null;

        // Route: /c/<card_id_b64url>.<sig> OR query ?c=...
        const cMatch = path.match(/\/c\/([^./]+)\.([^./]+)/) || search.match(/[?&]c=([^.&]+)\.([^.&]+)/);
        // Route: /p/<token> OR query ?p=...
        const pMatch = path.match(/\/p\/([^/]+)/) || search.match(/[?&]p=([^&]+)/);

        if (cMatch) {
          const rawId = cMatch[1];
          sig = cMatch[2];
          cardId = b64UrlToUuid(rawId) || rawId;
        } else if (pMatch) {
          token = decodeURIComponent(pMatch[1]);
        }

        if (!cardId && !token) {
          renderStudentCard('invalid', null, new Date(), 'The link provided is incomplete or malformed.');
          return;
        }

        const verifyUrl = (typeof EBSU_CONFIG !== 'undefined' && EBSU_CONFIG.VERIFY_CARD_URL)
          ? EBSU_CONFIG.VERIFY_CARD_URL
          : '';

        if (!verifyUrl) {
          renderStudentCard('offline', null, new Date(), 'Verification endpoint not configured.');
          return;
        }

        try {
          const headers = { 'Content-Type': 'application/json' };
          if (typeof EBSU_CONFIG !== 'undefined' && EBSU_CONFIG.SUPABASE_ANON_KEY) {
            headers['apikey'] = EBSU_CONFIG.SUPABASE_ANON_KEY;
            headers['Authorization'] = 'Bearer ' + EBSU_CONFIG.SUPABASE_ANON_KEY;
          }

          const payload = token
            ? { token, location: 'Public Web Scanner (c.html)' }
            : { card_id: cardId, signature: sig, location: 'Public Web Scanner (c.html)' };

          const res = await fetch(verifyUrl, {
            method: 'POST',
            headers,
            body: JSON.stringify(payload)
          });

          if (res.ok || res.status === 429) {
            const data = await res.json();
            renderStudentCard(data.status, data.student, data.checked_at, data.reason);
            return;
          }

          renderStudentCard('offline', null, new Date().toISOString());
        } catch (_) {
          renderStudentCard('offline', null, new Date().toISOString());
        }
      }

      window.addEventListener('DOMContentLoaded', verify);
    })();
  </script>
</body>
</html>
