<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification — EBSU Student Identity Portal</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #070f1e;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .verify-card-container {
      background: #0d1b30;
      border: 1px solid #1a2d4b;
      border-radius: 20px;
      width: 100%;
      max-width: 480px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #10b981;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 30px;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    .student-avatar-wrap {
      width: 100px;
      height: 115px;
      margin: 0 auto 20px auto;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #0056D2;
      background: #112038;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .student-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .student-name-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }
    .student-matric-sub {
      font-size: 14px;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 24px;
    }
    .verify-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #112038;
      border: 1px solid #1e355b;
      border-radius: 12px;
      padding: 16px 20px;
      text-align: left;
    }
    .v-item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #1e355b;
    }
    .v-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .v-lbl {
      color: #94a3b8;
    }
    .v-val {
      font-weight: 600;
      color: #f8fafc;
    }
    .seal-footer {
      margin-top: 24px;
      font-size: 11px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="verify-card-container">
    
    <div class="status-badge" id="verify-badge">
      <span style="font-size:16px;">✅</span> VERIFIED EBSU STUDENT
    </div>

    <div class="student-avatar-wrap">
      <img id="v-photo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 120' fill='%23cbd5e1'><rect width='100' height='120' fill='%23f1f5f9'/><circle cx='50' cy='45' r='22' fill='%2394a3b8'/><path d='M15 110 C 15 75, 85 75, 85 110 Z' fill='%2394a3b8'/></svg>" alt="Student Photo">
    </div>

    <h2 class="student-name-title" id="v-name">Ogbonnaya Nnagozie</h2>
    <div class="student-matric-sub" id="v-matric">MATRIC: EBSU/2019/97009</div>

    <div class="verify-grid">
      <div class="v-item">
        <span class="v-lbl">Faculty</span>
        <span class="v-val" id="v-faculty">Science</span>
      </div>
      <div class="v-item">
        <span class="v-lbl">Department</span>
        <span class="v-val" id="v-dept">Applied Biology</span>
      </div>
      <div class="v-item">
        <span class="v-lbl">Expiry Year</span>
        <span class="v-val" id="v-expiry">2023</span>
      </div>
      <div class="v-item">
        <span class="v-lbl">Blood Group</span>
        <span class="v-val" id="v-blood">O+</span>
      </div>
      <div class="v-item">
        <span class="v-lbl">Genotype</span>
        <span class="v-val" id="v-genotype">AA</span>
      </div>
      <div class="v-item">
        <span class="v-lbl">Fee Status</span>
        <span class="v-val" style="color:#10b981;font-weight:700;">PAID & CLEARED</span>
      </div>
    </div>

    <div class="seal-footer">
      🔒 Official Digital Verification • Ebonyi State University ICT
    </div>

  </div>

  <script>
    // Read URL query parameters dynamically
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      
      if (params.has('name')) document.getElementById('v-name').textContent = params.get('name');
      if (params.has('matric')) document.getElementById('v-matric').textContent = 'MATRIC: ' + params.get('matric');
      if (params.has('faculty')) document.getElementById('v-faculty').textContent = params.get('faculty');
      if (params.has('department')) document.getElementById('v-dept').textContent = params.get('department');
      if (params.has('expiry')) document.getElementById('v-expiry').textContent = params.get('expiry');
      if (params.has('blood')) document.getElementById('v-blood').textContent = params.get('blood');
      if (params.has('genotype')) document.getElementById('v-genotype').textContent = params.get('genotype');
    });
  </script>
</body>
</html>
